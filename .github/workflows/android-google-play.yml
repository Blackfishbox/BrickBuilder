name: Build and publish closed Google Play test

on:
  push:
    branches: [android/google-play]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Displayed version; defaults to ANDROID_VERSION_NAME"
        required: false
        type: string
      release_notes_de:
        description: "Optional manual German notes (maximum 500 characters); push builds use Release-Notes-DE commit trailers"
        required: false
        type: string

# Only the Android release branch can publish, and only to closed testing alpha.
permissions:
  contents: read

# Builds remain independent so every push receives its own downloadable artifacts.
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version_code: ${{ steps.release.outputs.version_code }}
      version_name: ${{ env.BRICKBUILDER_VERSION_NAME }}
    env:
      BRICKBUILDER_VERSION_NAME: ${{ inputs.version_name || vars.ANDROID_VERSION_NAME || '0.1.0' }}
      VERSION_CODE_OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET || '0' }}
      CATALOG_URL: ${{ vars.ANDROID_CATALOG_URL }}
      ANDROID_CATALOG_PATH: ${{ github.workspace }}/generated-artifacts/android-inputs/catalog.bin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the release branch and all release secrets
        env:
          ANDROID_UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PRIVACY_CONTROLLER_NAME: ${{ secrets.PRIVACY_CONTROLLER_NAME }}
          PRIVACY_CONTROLLER_STREET: ${{ secrets.PRIVACY_CONTROLLER_STREET }}
          PRIVACY_CONTROLLER_POSTAL_CITY: ${{ secrets.PRIVACY_CONTROLLER_POSTAL_CITY }}
          PRIVACY_CONTROLLER_COUNTRY: ${{ secrets.PRIVACY_CONTROLLER_COUNTRY }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import json
          import os
          if os.environ["GITHUB_REF"] != "refs/heads/android/google-play":
              raise SystemExit("Run this workflow only on android/google-play.")
          keys = [
              "ANDROID_UPLOAD_KEY_BASE64", "ANDROID_UPLOAD_STORE_PASSWORD",
              "ANDROID_UPLOAD_KEY_ALIAS", "ANDROID_UPLOAD_KEY_PASSWORD",
              "PRIVACY_CONTROLLER_NAME", "PRIVACY_CONTROLLER_STREET",
              "PRIVACY_CONTROLLER_POSTAL_CITY", "PRIVACY_CONTROLLER_COUNTRY",
              "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON",
          ]
          missing = [key for key in keys if not os.environ.get(key, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          try:
              account = json.loads(os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"])
              valid = account.get("type") == "service_account" and all(
                  isinstance(account.get(key), str) and account[key].strip()
                  for key in ("client_email", "private_key", "token_uri")
              )
          except (ValueError, AttributeError):
              valid = False
          if not valid:
              raise SystemExit("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON must contain the complete service-account JSON, not base64 or a filename.")
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Validate release settings and download the reviewed catalog
        id: release
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from "node:fs";
          const offset = process.env.VERSION_CODE_OFFSET;
          if (!/^(0|[1-9][0-9]{0,9})$/.test(offset)) throw Error("Invalid version code offset");
          const code = Number(offset) + Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isSafeInteger(code) || code < 1 || code > 2100000000) throw Error("Invalid version code");
          if (!/^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9.]+)?$/.test(process.env.BRICKBUILDER_VERSION_NAME)) {
            throw Error("Invalid version name");
          }
          if (!process.env.CATALOG_URL) throw Error("Set repository variable ANDROID_CATALOG_URL.");
          const url = new URL(process.env.CATALOG_URL);
          if (url.protocol !== "https:" || url.username || url.password) throw Error("Use a public HTTPS catalog URL without credentials");
          appendFileSync(process.env.GITHUB_ENV, `BRICKBUILDER_VERSION_CODE=${code}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version_code=${code}\n`);
          JS
          mkdir -p generated-artifacts/android-inputs
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 180 --max-filesize 2180181 "$CATALOG_URL" -o "$ANDROID_CATALOG_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install reviewed lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Check all resolved dependencies for security advisories
        run: pnpm run audit:dependencies
      - name: Check types and regressions
        run: |
          node --test scripts/android/*.test.mjs
          python3 -m unittest scripts/test_color_evidence.py
          python3 -m unittest discover -s scripts/android -p 'test_*.py'
          pnpm run typecheck:libs
          pnpm --filter @workspace/brickbuilder-mobile typecheck
          pnpm --filter @workspace/brickbuilder-mobile exec vitest run src/platform src/features/privacy src/features/parts src/features/catalog src/features/editor/catalog-construction.test.tsx src/features/inventory/builder-inventory.test.tsx src/features/engine/camera-gesture.test.ts src/features/connections/standard-plates.test.ts
          pnpm --filter @workspace/brickbuilder-mobile exec vitest run src/features/instructions src/features/formats/io src/features/formats/mpd/export.test.ts src/features/formats/backup-roundtrip.test.ts
      - name: Build Android assets with private controller details
        env:
          ANDROID_RELEASE_BUILD: "true"
          PRIVACY_CONTROLLER_NAME: ${{ secrets.PRIVACY_CONTROLLER_NAME }}
          PRIVACY_CONTROLLER_STREET: ${{ secrets.PRIVACY_CONTROLLER_STREET }}
          PRIVACY_CONTROLLER_POSTAL_CITY: ${{ secrets.PRIVACY_CONTROLLER_POSTAL_CITY }}
          PRIVACY_CONTROLLER_COUNTRY: ${{ secrets.PRIVACY_CONTROLLER_COUNTRY }}
        run: pnpm --filter @workspace/brickbuilder-mobile android:prepare
      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Capture resolved Android dependency paths
        working-directory: artifacts/brickbuilder-mobile/android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/generated-artifacts/android-security"
          bash gradlew --no-daemon --max-workers=2 \
            :app:dependencies \
            :capacitor-cordova-android-plugins:dependencies \
            :buildEnvironment \
            > "$GITHUB_WORKSPACE/generated-artifacts/android-security/dependency-paths.txt" 2>&1
      - name: Check resolved Android dependencies for advisories
        working-directory: artifacts/brickbuilder-mobile/android
        run: bash gradlew --no-daemon --max-workers=2 dependencyCheckAggregate
      - name: Upload Android dependency security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brickbuilder-android-dependency-security-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            generated-artifacts/android-security/dependency-paths.txt
            artifacts/brickbuilder-mobile/android/**/build/reports/dependency-check/**
      - name: Restore the upload keystore
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "$UPLOAD_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/brickbuilder-upload.p12"
          test -s "$RUNNER_TEMP/brickbuilder-upload.p12"
      - name: Build the signed release AAB
        working-directory: artifacts/brickbuilder-mobile/android
        env:
          ANDROID_REQUIRE_SIGNING: "true"
          ANDROID_UPLOAD_STORE_FILE: ${{ runner.temp }}/brickbuilder-upload.p12
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          # Maven Central can transiently fail artifact downloads. Gradle may
          # cache a missing-artifact response, so retry with refreshed dependency
          # metadata and backoff instead of repeating the same cached failure.
          for attempt in 1 2 3 4; do
            echo "Release build attempt ${attempt}/4"
            gradle_args=(--no-daemon --max-workers=2)
            if [ "$attempt" -gt 1 ]; then
              gradle_args+=(--refresh-dependencies)
            fi
            if bash gradlew "${gradle_args[@]}" :app:bundleRelease :app:lintRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 45))
              echo "Build failed; retrying after ${delay}s."
              sleep "$delay"
            fi
          done
          echo "::error::Release build failed after four attempts."
          exit 1
      - name: Verify the signature, R8 mapping and packaged privacy policy
        run: |
          AAB="artifacts/brickbuilder-mobile/android/app/build/outputs/bundle/release/app-release.aab"
          jarsigner -J-Duser.language=en -J-Duser.country=US -verify "$AAB" > "$RUNNER_TEMP/aab-verification.txt"
          grep -q 'jar verified\.' "$RUNNER_TEMP/aab-verification.txt"
          python3 scripts/android/verify-default-bundle.py "$AAB"
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          aab = Path("artifacts/brickbuilder-mobile/android/app/build/outputs/bundle/release/app-release.aab")
          mapping = Path("artifacts/brickbuilder-mobile/android/app/build/outputs/mapping/release/mapping.txt")
          if not mapping.is_file() or mapping.stat().st_size == 0:
              raise SystemExit("Release build did not generate a ProGuard/R8 mapping.txt.")
          if "# compiler: R8" not in mapping.read_text(encoding="utf-8"):
              raise SystemExit("Release mapping.txt is not an R8-generated mapping.")
          with zipfile.ZipFile(aab) as archive:
              index = archive.read("base/assets/public/index.html").decode("utf-8")
              if "viewport-fit=contain" not in index or "viewport-fit=cover" in index:
                  raise SystemExit("Release AAB does not contain the system-bar-safe Android viewport.")
              policy = archive.read("base/assets/public/privacy.html").decode("utf-8")
              if any(value in policy for value in (
                  "[Name des Verantwortlichen]", "[Straße und Hausnummer]",
                  "[Postleitzahl und Ort]", "[Land]",
              )):
                  raise SystemExit("Release AAB still contains privacy placeholders.")
          print("Signed AAB, R8 mapping and completed bundled privacy policy verified.")
          PY
      - name: Upload the Google Play release bundle
        uses: actions/upload-artifact@v4
        with:
          name: brickbuilder-play-aab-${{ env.BRICKBUILDER_VERSION_CODE }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/brickbuilder-mobile/android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload the matching ProGuard mapping
        uses: actions/upload-artifact@v4
        with:
          name: brickbuilder-proguard-${{ env.BRICKBUILDER_VERSION_CODE }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/brickbuilder-mobile/android/app/build/outputs/mapping/release/mapping.txt
      - name: Remove temporary signing and personal build data
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/brickbuilder-upload.p12" "$RUNNER_TEMP/aab-verification.txt"
          rm -f artifacts/brickbuilder-mobile/dist/public/privacy.html
          rm -f artifacts/brickbuilder-mobile/android/app/src/main/assets/public/privacy.html

  publish:
    name: Publish closed test (alpha)
    needs: android
    if: github.ref == 'refs/heads/android/google-play'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    # Never cancel an active Play edit. GitHub may replace an older pending
    # publish job with a newer one; each build's AAB and mapping remain available.
    concurrency:
      group: brickbuilder-google-play-alpha
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download this run's verified signed AAB
        uses: actions/download-artifact@v4
        with:
          name: brickbuilder-play-aab-${{ needs.android.outputs.version_code }}-${{ github.run_attempt }}
          path: generated-artifacts/google-play/aab
      - name: Download this run's matching ProGuard mapping
        uses: actions/download-artifact@v4
        with:
          name: brickbuilder-proguard-${{ needs.android.outputs.version_code }}-${{ github.run_attempt }}
          path: generated-artifacts/google-play/mapping
      - name: Build precise German release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PLAY_RELEASE_NOTES_DE: ${{ inputs.release_notes_de }}
        run: node scripts/android/play-release-notes.mjs
      - name: Publish the signed bundle to the closed alpha test
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: brickbuilder.blackfishbox.de
          releaseFiles: generated-artifacts/google-play/aab/app-release.aab
          mappingFile: generated-artifacts/google-play/mapping/mapping.txt
          tracks: alpha
          status: completed
          changesNotSentForReview: "false"
          releaseName: ${{ needs.android.outputs.version_name }} (${{ needs.android.outputs.version_code }})
          whatsNewDirectory: generated-artifacts/google-play/whatsnew
