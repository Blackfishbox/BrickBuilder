name: Verify native Android system-bar bounds

on:
  workflow_call:
    inputs:
      catalog_url:
        description: "Effective catalog URL used by the calling release build"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      catalog_url:
        description: "Reviewed HTTPS catalog URL; defaults to ANDROID_CATALOG_URL"
        required: false
        type: string

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    env:
      CATALOG_URL: ${{ inputs.catalog_url || vars.ANDROID_CATALOG_URL }}
      ANDROID_CATALOG_PATH: ${{ github.workspace }}/generated-artifacts/android-inputs/catalog.bin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare local test assets without personal release fields
        run: |
          pnpm install --frozen-lockfile
          node --input-type=module <<'JS'
          const url = new URL(process.env.CATALOG_URL);
          if (url.protocol !== "https:" || url.username || url.password) {
            throw Error("Use a public HTTPS catalog URL without credentials");
          }
          JS
          mkdir -p generated-artifacts/android-inputs
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 180 --max-filesize 2180181 "$CATALOG_URL" -o "$ANDROID_CATALOG_PATH"
          pnpm --filter @workspace/brickbuilder-mobile android:prepare
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Allow hardware-accelerated Android emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check actual native and WebView bounds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disable-animations: true
          enable-hw-keyboard: false
          script: bash scripts/android/check-native-insets.sh
      - name: Keep native screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-insets-api-${{ matrix.api }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            generated-artifacts/native-insets
            artifacts/brickbuilder-mobile/android/app/build/reports/tests/testDebugUnitTest
            artifacts/brickbuilder-mobile/android/app/build/reports/androidTests/connected
            artifacts/brickbuilder-mobile/android/app/build/outputs/androidTest-results/connected
