// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.owasp:dependency-check-gradle:13.0.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    apply plugin: 'org.owasp.dependencycheck'

    repositories {
        google()
        mavenCentral()
    }

    def nvdApiKey = System.getenv('NVD_API_KEY')?.trim()
    if (nvdApiKey) {
        dependencyCheck.nvd.apiKey.set(nvdApiKey)
    }

    dependencyCheck {
        failBuildOnCVSS = 0.0
        formats = ['HTML', 'JSON']
        // Scan the exact dependency graph packaged in the Android release.
        // The Android Gradle plugin also creates internal UTP configurations
        // that are not named "test" and are not covered by skipTestGroups.
        scanProjects = [':app']
        scanConfigurations = ['releaseRuntimeClasspath']
        scanBuildEnv = false
        skipTestGroups = true
        analyzers {
            nodeAudit {
                // The workspace pnpm audit runs separately. Disable these
                // API-backed checks here: Yarn Audit also scans temporary
                // lockfiles embedded in Gradle plugins.
                enabled = false
                yarnEnabled = false
                pnpmEnabled = false
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
