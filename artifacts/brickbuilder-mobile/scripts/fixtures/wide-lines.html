<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>BrickBuilder real WebGL edge regression</title>
<style>
body { font: 16px sans-serif; background: #eee; margin: 18px; }
main { display: flex; gap: 20px; } h2 { margin: 8px 0; }
canvas { background: #dce4df; width: 500px; height: 440px; }
pre { white-space: pre-wrap; }
</style>
<h1>Same placed parts, same camera — real WebGL</h1>
<main><section><h2>Edges off</h2><div id="off"></div></section>
<section><h2>Edges on</h2><div id="on"></div></section></main>
<pre id="result">Pending</pre>
<script type="module">
import {
  AmbientLight, BoxGeometry, DirectionalLight, EdgesGeometry,
  Group, InstancedBufferAttribute, InstancedBufferGeometry, Mesh,
  MeshLambertMaterial, OrthographicCamera, Scene, WebGLRenderer, WebGLRenderTarget,
} from "three";
import { expandWideLines, wideLineMaterial, setWideLineResolution, THICK_EDGE_WIDTH_PX } from "/src/features/engine/wide-lines.ts";

const result = document.querySelector("#result");
function assert(condition, message) { if (!condition) throw new Error(message); }
try {
  const renderer = new WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(500, 440);
  const camera = new OrthographicCamera(-4, 4, 3.52, -3.52, 0.1, 100);
  camera.position.set(7, 6, 9); camera.lookAt(0, 0, 0);
  const scene = new Scene();
  scene.add(new AmbientLight(0xffffff, 2));
  const light = new DirectionalLight(0xffffff, 3); light.position.set(4, 6, 9); scene.add(light);
  const solid = new BoxGeometry(2.4, 1.4, 1.6);
  const edgeGeometry = new EdgesGeometry(solid);
  const expanded = expandWideLines(edgeGeometry.getAttribute("position").array);
  const geometry = new InstancedBufferGeometry();
  for (const [name, attribute] of Object.entries(expanded.attributes)) geometry.setAttribute(name, attribute);
  // Two actual instances, including a rotated/translated instance.
  geometry.setAttribute("instanceRow0", new InstancedBufferAttribute(new Float32Array([1,0,0,-1.4, 0,0,1,1.4]), 4));
  geometry.setAttribute("instanceRow1", new InstancedBufferAttribute(new Float32Array([0,1,0,-0.7, 0,1,0,0.7]), 4));
  geometry.setAttribute("instanceRow2", new InstancedBufferAttribute(new Float32Array([0,0,1,0, -1,0,0,0]), 4));
  geometry.setAttribute("instructionFocus", new InstancedBufferAttribute(new Float32Array(2), 1));
  geometry.instanceCount = 2;
  const material = wideLineMaterial();
  setWideLineResolution(material, 500, 440);
  const edges = new Mesh(geometry, material); edges.frustumCulled = false; edges.renderOrder = 10;
  scene.add(edges);
  // Read actual GPU output before adding faces: every instance must produce
  // nonzero rasterized area, not just have correct JavaScript uniforms.
  const target = new WebGLRenderTarget(500, 440);
  function pixels(width) {
    material.uniforms.lineWidth.value = width;
    material.uniforms.edgeOpacity.value = 0.25;
    renderer.setRenderTarget(target); renderer.render(scene, camera);
    const data = new Uint8Array(500 * 440 * 4);
    renderer.readRenderTargetPixels(target, 0, 0, 500, 440, data);
    return data;
  }
  const thin = pixels(1), thick = pixels(THICK_EDGE_WIDTH_PX);
  const count = bytes => bytes.reduce((total, value, index) => total + (index % 4 === 3 && value > 0 ? 1 : 0), 0);
  // Negative control: the old endpoint interpolation collapsed every quad.
  const correctedShader = material.vertexShader;
  material.vertexShader = correctedShader
    .replace("(screenB - screenA) * (1.0 - 2.0 * lineEndpoint)", "screenB - screenA")
    .replace("vec4 clip = clipA;", "vec4 clip = mix(clipA, clipB, lineEndpoint);");
  material.needsUpdate = true;
  const brokenCount = count(pixels(THICK_EDGE_WIDTH_PX));
  assert(brokenCount === 0, `Negative control failed: ${brokenCount} pixels`);
  material.vertexShader = correctedShader; material.needsUpdate = true;
  const thinCount = count(thin), thickCount = count(thick);
  assert(thinCount > 500, `Collapsed or missing GPU edges: ${thinCount} pixels`);
  assert(thickCount > thinCount * 2, `Thick edges have no visible effect: ${thinCount} -> ${thickCount}`);
  const halves = [0, 0];
  for (let y = 0; y < 440; y++) for (let x = 0; x < 500; x++) {
    if (thick[(y * 500 + x) * 4 + 3]) halves[x < 250 ? 0 : 1]++;
  }
  assert(halves.every(value => value > 500), "An instanced part lost its edges");
  renderer.setRenderTarget(null);
  const faces = new Group();
  for (const [x, y, angle, color] of [[-1.4,-0.7,0,0x2164ae],[1.4,0.7,Math.PI/2,0xdb3939]]) {
    const mesh = new Mesh(solid, new MeshLambertMaterial({ color }));
    mesh.position.set(x,y,0); mesh.rotation.y = angle; faces.add(mesh);
  }
  scene.add(faces);
  for (const enabled of [false, true]) {
    edges.visible = enabled;
    renderer.render(scene, camera);
    const canvas = document.createElement("canvas"); canvas.width = 500; canvas.height = 440;
    canvas.getContext("2d").drawImage(renderer.domElement, 0, 0);
    document.querySelector(enabled ? "#on" : "#off").append(canvas);
  }
  assert(renderer.info.programs.every(program => program.diagnostics?.runnable !== false), "Shader compilation failed");
  result.textContent = `PASS: old shader ${brokenCount} pixels; thin ${thinCount}; thick ${thickCount}; both transformed instances visible.`;
  document.body.dataset.result = "passed";
  target.dispose(); renderer.dispose();
} catch (error) {
  document.body.dataset.result = "failed";
  result.textContent = error.stack;
}
</script>
</html>
